name: Build WideLoadScreens

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build x86 DLL
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if not exist dist mkdir dist
          cl /nologo /O2 /W4 /LD /MT /GS- src\WideLoadScreens.c /link /OUT:dist\WideLoadScreens.dll
          dumpbin /headers dist\WideLoadScreens.dll | findstr /C:"14C machine (x86)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WideLoadScreens
          path: dist/WideLoadScreens.dll
          if-no-files-found: error

      - name: Select release tag
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release-v1.0.0]')
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            "TAG_NAME=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            "TAG_NAME=v1.0.0" >> $env:GITHUB_ENV
          }

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release-v1.0.0]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:TAG_NAME" "dist/WideLoadScreens.dll#WideLoadScreens.dll" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "WideLoadScreens $env:TAG_NAME" `
            --notes "Runtime widescreen loading-screen patch for the 32-bit World of Warcraft 1.12.1 client. Release asset: WideLoadScreens.dll."
